server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión (Fase 8): el JS y el CSS son texto y se achican ~70 %. Sin esto el navegador baja los 354 KB del
  # bundle completos. Las fuentes .woff2 y las imágenes ya vienen comprimidas, por eso no se listan.
  # "Vary: Accept-Encoding" avisa a cachés intermedios que hay una versión por cada codificación.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # El navegador llama a /api/... en el mismo origen que la página: no hace falta CORS.
  # nginx le saca el prefijo /api y lo reenvía al BFF por el nombre que tiene en la red de Docker.
  location /api/ {
    proxy_pass http://web-bff:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Los pagos pueden tardar unos segundos (el BFF espera a que exista el pago)
    proxy_read_timeout 30s;
  }

  # Los archivos con hash en el nombre no cambian nunca: se pueden cachear un año
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rutas de la app (/reservas, /restaurantes/123...): siempre devuelven index.html y decide React Router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
