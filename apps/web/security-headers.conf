# Headers de seguridad de la app. Se incluye en cada location que sirve archivos (no en /api: esos los pone el BFF).
# Va en un archivo aparte porque en nginx un add_header dentro de un location ANULA todos los del server: como
# / y /assets/ tienen su propio Cache-Control, puestos a nivel server no saldrían en ninguno de los dos.
# "always": también en las respuestas de error (404...).

# CSP: la app solo carga cosas propias. Las fuentes están dentro del bundle (fontsource), el único dato inline es el
# favicon (data:) y el navegador solo habla con /api, en el mismo origen. Así, un script inyectado (XSS) no corre
# ni puede mandar datos a otro dominio. Sin 'unsafe-inline': React aplica los style={} por el DOM, no como atributo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Que otra página no pueda meter la app en un iframe (clickjacking). frame-ancestors lo cubre; esto es para navegadores viejos.
add_header X-Frame-Options "DENY" always;
# Que el navegador no "adivine" el tipo de un archivo: se usa solo como lo que dice su Content-Type
add_header X-Content-Type-Options "nosniff" always;
# A otros sitios solo se les manda el origen, no la ruta (que puede llevar ids de reservas)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La app no usa cámara, micrófono ni ubicación: si algo inyectado los pide, el navegador los niega
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
# Una ventana abierta desde otro sitio no puede manipular esta (window.opener)
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS (Strict-Transport-Security) va recién con HTTPS: por HTTP el navegador lo ignora (ver README).
