# Healthchecks: start_period es el tiempo de gracia del arranque (ahí un chequeo fallido no cuenta para
# "unhealthy"), y start_interval chequea seguido mientras tanto, así el contenedor queda healthy apenas está listo.
# Si un depends_on con service_healthy ve "unhealthy", compose aborta el up ("dependency failed to start").
# Un start_period largo no demora nada si todo anda: solo tarda más en declarar caída una base que de verdad no arranca.
#
# Bases y RabbitMQ con stop_grace_period: 1m. Por defecto Docker espera 10 s y después mata el proceso: con todo
# apagándose a la vez, Postgres no llegaba a cerrar prolijo y al volver hacía recuperación (fsync de todo el
# directorio de datos): ~2 minutos rechazando conexiones. Por eso también su start_period es de 3 minutos.

# Servicios Node: su /health responde 503 si su base no responde. $$PORT es la variable PORT de cada contenedor.
x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      # Puerto 5433 en tu máquina para no chocar con un Postgres local
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3m
      start_interval: 1s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    healthcheck: *app-healthcheck
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dentro de la red de Docker los servicios se encuentran por nombre
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_USER: ${AUTH_DB_USER:-auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ALLOW_OWNER_SELF_REGISTER: ${ALLOW_OWNER_SELF_REGISTER:-false}
    ports:
      - "${AUTH_PORT:-3001}:3001"

  mongo-restaurants:
    image: mongo:7
    container_name: mongo-restaurants
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RESTAURANTS_MONGO_USER:-restaurants}
      MONGO_INITDB_ROOT_PASSWORD: ${RESTAURANTS_MONGO_PASSWORD:-restaurants_password}
    ports:
      # Puerto 27018 en tu máquina para no chocar con un MongoDB local
      - "${RESTAURANTS_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-restaurants-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      # mongosh es una app de Node: el ping tarda ~1 s en reposo y más de 10 s con la máquina cargada
      # (arrancando todo a la vez), aunque Mongo ya esté listo. Con 5 s el chequeo fallaba solo.
      timeout: 20s
      retries: 10
      start_period: 2m
      start_interval: 3s

  restaurants-service:
    build:
      context: .
      dockerfile: services/restaurants-service/Dockerfile
    container_name: restaurants-service
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    healthcheck: *app-healthcheck
    depends_on:
      mongo-restaurants:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caché (Fase 8). Para medir "sin caché" levantá el servicio con RESTAURANTS_REDIS_URL vacía:
      #   RESTAURANTS_REDIS_URL= docker compose up -d restaurants-service
      # (el guion de ${VAR-valor} usa el valor por defecto solo si la variable NO está definida; vacía = apagado)
      REDIS_URL: ${RESTAURANTS_REDIS_URL-redis://redis:6379}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      # Si cambiás la contraseña por una con caracteres especiales, codificala (URL-encode)
      MONGO_URI: mongodb://${RESTAURANTS_MONGO_USER:-restaurants}:${RESTAURANTS_MONGO_PASSWORD:-restaurants_password}@mongo-restaurants:27017/${RESTAURANTS_MONGO_DB:-restaurants_db}?authSource=admin
      # Mismo secreto que auth-service: así valida los JWT que ese servicio emite
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
    ports:
      - "${RESTAURANTS_PORT:-3002}:3002"

  # ---------- Caché (Fase 8) ----------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Es un caché, no una base de datos: sin persistencia, memoria acotada, y si se llena descarta
    # (solo) las claves que tienen vencimiento, las menos usadas primero. La clave de versión no vence, así que nunca se descarta.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
      start_interval: 1s

  postgres-reservations:
    image: postgres:16-alpine
    container_name: postgres-reservations
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${RESERVATIONS_DB_USER:-reservations}
      POSTGRES_PASSWORD: ${RESERVATIONS_DB_PASSWORD:-reservations_password}
      POSTGRES_DB: ${RESERVATIONS_DB_NAME:-reservations_db}
    ports:
      # Puerto 5434 en tu máquina (5433 ya lo usa la base de auth)
      - "${RESERVATIONS_DB_PORT:-5434}:5432"
    volumes:
      - postgres-reservations-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVATIONS_DB_USER:-reservations} -d ${RESERVATIONS_DB_NAME:-reservations_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3m
      start_interval: 1s

  reservations-service:
    build:
      context: .
      dockerfile: services/reservations-service/Dockerfile
    container_name: reservations-service
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    healthcheck: *app-healthcheck
    depends_on:
      postgres-reservations:
        condition: service_healthy
      restaurants-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres-reservations
      DB_PORT: 5432
      DB_USER: ${RESERVATIONS_DB_USER:-reservations}
      DB_PASSWORD: ${RESERVATIONS_DB_PASSWORD:-reservations_password}
      DB_NAME: ${RESERVATIONS_DB_NAME:-reservations_db}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      # Dentro de la red de Docker los servicios se encuentran por nombre
      RESTAURANTS_SERVICE_URL: http://restaurants-service:3002
      RESTAURANT_TIME_ZONE: ${RESTAURANT_TIME_ZONE:-America/Argentina/Buenos_Aires}
      RESERVATION_DURATION_MINUTES: ${RESERVATION_DURATION_MINUTES:-90}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reservas}:${RABBITMQ_PASSWORD:-reservas_password}@rabbitmq:5672
      # Seña por persona, en centavos (0 = sin seña: las reservas nacen confirmadas)
      DEPOSIT_PER_PERSON_CENTS: ${DEPOSIT_PER_PERSON_CENTS:-200000}
      DEPOSIT_CURRENCY: ${DEPOSIT_CURRENCY:-ARS}
      PAYMENT_WINDOW_MINUTES: ${PAYMENT_WINDOW_MINUTES:-15}
      MAX_PENDING_RESERVATIONS: ${MAX_PENDING_RESERVATIONS:-3}
      REFUND_CUTOFF_HOURS: ${REFUND_CUTOFF_HOURS:-24}
    ports:
      - "${RESERVATIONS_PORT:-3003}:3003"

  # ---------- Mensajería y pagos (Fase 6) ----------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-reservas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-reservas_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672" # AMQP: lo usan los servicios
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # panel web: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      # Igual que mongosh: la CLI de Erlang es pesada (~1,2 s en reposo) y bajo carga se pasa de 10 s
      timeout: 20s
      retries: 10
      start_period: 2m
      start_interval: 3s

  postgres-payments:
    image: postgres:16-alpine
    container_name: postgres-payments
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER:-payments}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_password}
      POSTGRES_DB: ${PAYMENTS_DB_NAME:-payments_db}
    ports:
      # Puerto 5435 en tu máquina (5433 auth, 5434 reservations)
      - "${PAYMENTS_DB_PORT:-5435}:5432"
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER:-payments} -d ${PAYMENTS_DB_NAME:-payments_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3m
      start_interval: 1s

  payments-service:
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    container_name: payments-service
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    healthcheck: *app-healthcheck
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres-payments
      DB_PORT: 5432
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_password}
      DB_NAME: ${PAYMENTS_DB_NAME:-payments_db}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reservas}:${RABBITMQ_PASSWORD:-reservas_password}@rabbitmq:5672
      # Pasarela: 'simulated' (la de desarrollo). Más adelante, la real elegida por esta variable.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      # La imagen corre con NODE_ENV=production y la simulada pide aceptarse a conciencia (ver .env.example)
      ALLOW_SIMULATED_GATEWAY: ${ALLOW_SIMULATED_GATEWAY:-false}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:?Definí GATEWAY_WEBHOOK_SECRET en el archivo .env}
      SIMULATED_WEBHOOK_DELAY_MS: ${SIMULATED_WEBHOOK_DELAY_MS:-3000}
    ports:
      - "${PAYMENTS_PORT:-3004}:3004"

  mongo-notifications:
    image: mongo:7
    container_name: mongo-notifications
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATIONS_MONGO_USER:-notifications}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATIONS_MONGO_PASSWORD:-notifications_password}
    ports:
      # Puerto 27019 en tu máquina para no chocar con mongo-restaurants (27018) ni con un MongoDB local
      - "${NOTIFICATIONS_MONGO_PORT:-27019}:27017"
    volumes:
      - mongo-notifications-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      # mongosh es una app de Node: el ping tarda ~1 s en reposo y más de 10 s con la máquina cargada
      # (arrancando todo a la vez), aunque Mongo ya esté listo. Con 5 s el chequeo fallaba solo.
      timeout: 20s
      retries: 10
      start_period: 2m
      start_interval: 3s

  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    container_name: notifications-service
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    healthcheck: *app-healthcheck
    depends_on:
      mongo-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3005
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Si cambiás la contraseña por una con caracteres especiales, codificala (URL-encode)
      MONGO_URI: mongodb://${NOTIFICATIONS_MONGO_USER:-notifications}:${NOTIFICATIONS_MONGO_PASSWORD:-notifications_password}@mongo-notifications:27017/${NOTIFICATIONS_MONGO_DB:-notifications_db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reservas}:${RABBITMQ_PASSWORD:-reservas_password}@rabbitmq:5672
    ports:
      - "${NOTIFICATIONS_PORT:-3005}:3005"

  web-bff:
    build:
      context: .
      dockerfile: services/web-bff/Dockerfile
    container_name: web-bff
    labels:
      logging: "reservas" # Alloy solo lee los logs de los contenedores con esta etiqueta
    restart: unless-stopped
    # Espera a que los servicios respondan su /health: si no, los primeros pedidos del front darían 503
    depends_on:
      auth-service:
        condition: service_healthy
      restaurants-service:
        condition: service_healthy
      reservations-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      # Dentro de la red de Docker los servicios se encuentran por nombre
      AUTH_SERVICE_URL: http://auth-service:3001
      RESTAURANTS_SERVICE_URL: http://restaurants-service:3002
      RESERVATIONS_SERVICE_URL: http://reservations-service:3003
      PAYMENTS_SERVICE_URL: http://payments-service:3004
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3005
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-3000}
      # El navegador entra por nginx (servicio web), que agrega X-Forwarded-For: así el BFF ve la IP real
      # para los límites de login. Ojo: el puerto 3000 publicado acá permite saltear nginx e inventar ese header;
      # en un deploy solo se publica web.
      TRUST_PROXY: 1
    ports:
      - "${BFF_PORT:-3000}:3000"

  # ---------- Pruebas de carga (Fase 8) ----------
  # No arranca con `docker compose up`: solo cuando se lo pide el perfil "perf". Corre dentro de la red de
  # compose, así que mide los servicios sin pasar por la red de tu máquina. Ver perf/README.md
  k6:
    image: grafana/k6:0.55.0
    profiles: ["perf"]
    user: root # para poder escribir los resultados en ./perf/results (carpeta de tu máquina)
    # Los scripts se indican con rutas RELATIVAS a esta carpeta. Con rutas que empiezan con "/" Git Bash (Windows)
    # las convierte a «C:/Program Files/Git/...» y k6 no encuentra el archivo.
    working_dir: /perf
    environment:
      BASE_URL: http://web-bff:3000
      RATE: ${RATE:-100}
      DURATION: ${DURATION:-30s}
      WARMUP: ${WARMUP:-10s}
    volumes:
      - ./perf:/perf
    entrypoint: ["k6"]

  # ---------- Observabilidad: logs centralizados ----------
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Para descubrir los contenedores y leer sus logs (solo lectura)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs de los servicios que corrés fuera de Docker (LOG_DIR=../../logs)
      - ./logs:/var/log/reservas:ro

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      # SOLO PARA DESARROLLO LOCAL: entra directo, sin usuario ni contraseña
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3030}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      - web-bff
    ports:
      - "5173:80"

volumes:
  rabbitmq-data:
  postgres-payments-data:
  postgres-auth-data:
  mongo-restaurants-data:
  mongo-notifications-data:
  postgres-reservations-data:
  loki-data:
  grafana-data:
